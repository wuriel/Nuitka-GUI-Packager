name: Build with Nuitka on Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-nuitka:
    runs-on: windows-latest

    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖和 Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: 打包主程序 (带版本号)
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --remove-output `
            --show-progress `
            --show-memory `
            --windows-icon-from-ico=icons/382_128x128.ico `
            --output-dir=dist `
            --enable-plugin=pyside6 `
            --follow-imports `
            --assume-yes-for-downloads `
            --output-filename="${{ github.event.repository.name }}-zh-${{ github.ref_name }}.exe" `
            src/main_zh.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-zh-${{ github.ref_name }}"
          path: dist/*.exe
